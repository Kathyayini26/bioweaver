<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO and Branding Metadata -->
    <title>BioWeaver — Biomedical Knowledge Graph Exploration Platform</title>
    <meta name="description" content="BioWeaver is an AI-powered biomedical knowledge graph platform that integrates heterogeneous biomedical datasets, Node2Vec embeddings, and machine learning to discover novel gene–disease associations." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BioWeaver — Biomedical Knowledge Graph Exploration Platform" />
    <meta property="og:description" content="BioWeaver is an AI-powered biomedical knowledge graph platform that integrates heterogeneous biomedical datasets, Node2Vec embeddings, and machine learning to discover novel gene–disease associations." />
    <meta property="og:image" content="/og-image.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="BioWeaver — Biomedical Knowledge Graph Exploration Platform" />
    <meta property="twitter:description" content="BioWeaver is an AI-powered biomedical knowledge graph platform that integrates heterogeneous biomedical datasets, Node2Vec embeddings, and machine learning to discover novel gene–disease associations." />
    <meta property="twitter:image" content="/og-image.png" />
    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      /* Ensure scrollbars are styled and slim */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 9999px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #334155;
      }
    </style>
  </head>
  <body class="overflow-hidden m-0 p-0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
